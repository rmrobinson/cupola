location:
  name: "Home"
  lat: 43.45
  lon: -80.49
  timezone: "America/Toronto"

server:
  # Host/address to bind. Use "localhost" for local-only access, "0.0.0.0"
  # for LAN access, or a specific hostname/address for tighter binding.
  host: "localhost"
  port: 8181
  data_dir: "./data"
  # Exact browser origins allowed to call the API cross-origin. If omitted,
  # Cupola allows only http://{server.host}:{server.port}. Same-origin browser
  # access does not require CORS.
  # cors_allowed_origins:
  #   - "http://localhost:8181"
  # Extra external image origins allowed by Content-Security-Policy img-src.
  # Used for traffic camera snapshots and Environment Canada hourly icons.
  csp_img_src:
    - "https://511on.ca"
    - "https://511.alberta.ca"
    - "https://www.drivebc.ca"
    - "https://weather.gc.ca"

tiles:
  radius_km: 50
  cache_path: "data/tiles/local.pmtiles"

collectors:
  weather_ecowitt:
    enabled: true
    url: "http://192.168.1.x"
    poll_interval: 60s

  weather_envcanada:
    enabled: true
    # Station auto-discovered from lat/lon; override if discovery fails:
    # station_code: s0000585
    # province: ON
    poll_interval_forecast: 1h
    poll_interval_hourly_forecast: 20m
    poll_interval_alerts: 15m

  solar_envcanada:
    enabled: true
    poll_interval: 1h
    # region auto-selected from lat/lon; override with:
    # region: 4

  transit:
    rt_poll_interval: 30s
    static_refresh_interval: 24h

  traffic_511:
    enabled: true
    provinces: [ON]
    poll_interval_incidents: 15m
    poll_interval_cameras: 24h

  aircraft_dump1090:
    enabled: true
    url: "http://localhost:8080"
    poll_interval: 5s

  # house is deferred — see implementation plan
  # house:
  #   enabled: true
  #   url: "http://localhost:9000"
  #   poll_interval: 30s

  rss_feeds:
    - id: region_of_waterloo
      url: "https://example.com/rss"
      category: municipal
      poll_interval: 15m

  flag_canada:
    enabled: true
    poll_interval: 4h
    # The canada.ca half-masting page URL sometimes changes.
    # Override here if the default URLs no longer return 200:
    # url: "https://www.canada.ca/en/canadian-heritage/services/flag-canada/flying-lowering-flags.html"

  waterways:
    - id: grand_river
      parser: grca
      url: "https://www.grandriver.ca/our-watershed/river-data/"
      poll_interval: 15m
      alert_on: [warning, emergency]

  municipal:
    - id: kitchener_snow
      parser: kitchener.snow
      url: "https://www.kitchener.ca/news/snow-events/"
      poll_interval: 30m
      domain: municipal.alerts
    - id: grca_flood
      parser: grca.flood
      url: "https://www.grandriver.ca/news/categories/flood-messages/"
      poll_interval: 15m
      domain: municipal.alerts
    - id: enova_power
      parser: enova.power
      url: "https://oms.enovapower.com/Outages/"
      poll_interval: 10m
      domain: municipal.alerts
    - id: kitchener_utilities
      parser: kitchener.utilities
      url: "https://www.kitchenerutilities.ca/en/outages-and-news.aspx"
      poll_interval: 10m
      domain: municipal.alerts

  waste_collection:
    enabled: true
    data_path: "data/waste_schedule.json"
    # week_start controls when the widget switches to the next week's entry.
    # Defaults to "sunday". Other values: monday, tuesday, ..., saturday.
    week_start: sunday

  imap:
    enabled: false   # enable in phase 2 (IMAP dispatcher)
    host: "imap.example.com"
    port: 993
    username: "alerts@example.com"
    password: "${IMAP_PASSWORD}"
    poll_interval: 2m
